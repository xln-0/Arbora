name: Validate application

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build shared, API and Web
    # develop has already been validated before its release PR to main.
    if: github.base_ref == 'develop' || github.head_ref != 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run gen:database
        env:
          DATABASE_URL: postgresql://arbora:password@localhost:5432/arbora

      - name: Build application
        run: npm run build

      - name: Test API rules
        run: npm run test:api
