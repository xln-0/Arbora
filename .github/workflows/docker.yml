name: Publish Docker images

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API
            image: arbora-api
            dockerfile: apps/api/Dockerfile
          - name: Web
            image: arbora-web
            dockerfile: apps/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"

          if [[ "${{ github.ref_name }}" == "main" ]]; then
            version="$(node --print "require('./package.json').version")"
            {
              echo "value<<EOF"
              echo "${image}:latest"
              echo "${image}:${version}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "value=${image}:beta" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.ref_name == 'main' && 'linux/amd64,linux/arm64' || 'linux/arm64' }}
          push: true
          tags: ${{ steps.tags.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image }}-${{ github.ref_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ github.ref_name }}
          provenance: false
